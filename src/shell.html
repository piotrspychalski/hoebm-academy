<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HoEBM Academy</title>
<meta name="description" content="Interactive schematic figures on endurance-sport physiology, with every number tied to its source. House of EBM, by Piotr Spychalski, MD, PhD.">
<meta name="author" content="Piotr Spychalski, MD, PhD">
<!--ROBOTS-->
<link rel="icon" type="image/svg+xml" href="%FAVICON%">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Tokeny marki House of EBM (brand guide 04.11.2026) — JEDYNE miejsce z kolorami, krojami, grubościami i czasami.
   src/core/01-tokeny.js czyta je przez getComputedStyle, więc canvas i HTML mają te same wartości. */
:root {
  --paper: #F2F0F1;        /* tło: jasny róż marki */
  --ink: #1B5996;          /* linie, wykresy, tekst: granat marki */
  --ink-2: #38305F;        /* tekst drugorzędny, legendy: ciemny fiolet marki */
  --marker: #D9C0CF;       /* zakreślacz, wyróżnienia: ciemny róż marki */
  --hair: #D9C0CF;         /* cienkie linie pomocnicze */
  --blood: #C2185B;        /* krew — jedyny kolor spoza marki, znaczeniowy */
  --display: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --line: 2px;             /* osie, ramki */
  --line-bold: 6px;        /* krzywe danych */
  --reveal-ms: 1200;       /* „Science made clear”: wyostrzenie tytułu */
  --clean-ms: 1500;        /* #record: czysta klatka przed sekwencją */
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--sans); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blood); outline-offset: 2px; }

/* Nagłówek */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px max(16px, env(safe-area-inset-left)); border-bottom: var(--line) solid var(--ink); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; }
.brand img { height: 34px; width: auto; display: block; animation: hoebm-clear 1.2s ease-out both; }
/* Motyw marki „Science made clear”: logo w nagłówku wyostrza się z rozmycia przy wejściu na stronę */
@keyframes hoebm-clear { from { filter: blur(8px); opacity: .35; } to { filter: blur(0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .brand img { animation: none; } }
.brand span { font: 600 13px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); border-left: var(--line) solid var(--ink); padding-left: 10px; }
.search { flex: 0 1 260px; min-width: 0; border: 1.5px solid var(--ink); border-radius: 2px; background: var(--paper); padding: 7px 10px; }
.btn { background: var(--paper); border: 1.5px solid var(--ink); border-radius: 2px; padding: 7px 12px; font-weight: 600; cursor: pointer; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover, .btn[aria-pressed="true"] { background: var(--marker); }
.btn.ghost { border-color: transparent; }

/* Serie i lista rycin */
.series { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; border-bottom: 1px solid var(--hair); scrollbar-width: thin; }
.chip { flex: none; font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; border: 1.5px solid var(--ink); border-radius: 2px; padding: 5px 10px; background: var(--paper); cursor: pointer; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.figlist { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; }
.figbtn { flex: none; text-align: left; border: 1.5px solid var(--ink); border-radius: 2px; padding: 6px 10px; background: var(--paper); cursor: pointer; max-width: 260px; }
.figbtn[aria-current="true"] { background: var(--marker); }
.figbtn small { display: block; font: 600 11px var(--mono); color: var(--ink-2); letter-spacing: .06em; }

/* Układ: scena + panel opisu */
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: 24px; padding: 16px; max-width: 1320px; margin: 0 auto; }
.stagecol { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
/* Komputer (html.wide): rycina w układzie poziomym 1440 × 810 na pełną szerokość, opis pod nią w dwóch kolumnach.
   Telefon: pionowy obszar treści (1080 × 1030). Studio: pełne 9:16. */
.stage-wrap { width: min(100%, calc((100vh - 250px) * 16 / 9), 1400px); }   /* 250 px = nagłówek + serie + lista rycin + odstępy */
html.wide main { grid-template-columns: minmax(0, 1fr); max-width: 1440px; }
html.wide .panel { border-left: 0; border-top: var(--line) solid var(--ink); padding: 16px 0 0; columns: 2 340px; column-gap: 40px; }
html.wide .panel > * { break-inside: avoid; }
html.wide .panel h2 { column-span: all; }
canvas#stage { display: block; width: 100%; height: auto; background: var(--paper); border: 1px solid var(--hair); }
.stagecol .controls { width: min(100%, 1000px); }
.controls { width: min(100%, 540px); display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row label { font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); min-width: 72px; }
.row input[type="range"] { flex: 1 1 180px; min-width: 0; accent-color: var(--blood); }
.row output { font: 600 13px var(--mono); min-width: 80px; }
.panel { border-left: var(--line) solid var(--ink); padding-left: 20px; min-width: 0; }
.panel h2 { font: 800 22px/1.2 var(--display); margin: 0 0 8px; }
.panel h3 { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 20px 0 6px; }
.panel ul, .panel ol { padding-left: 20px; margin: 0; }
.panel li { margin: 4px 0; }
.panel a { color: var(--ink); }
.empty { color: var(--ink-2); }
footer { border-top: 1px solid var(--hair); padding: 14px 16px 28px; font-size: 13px; color: var(--ink-2); text-align: center; }
footer a { color: var(--ink-2); }

/* Okna */
dialog { border: var(--line) solid var(--ink); border-radius: 2px; background: var(--paper); color: var(--ink); max-width: min(560px, calc(100vw - 32px)); padding: 24px; }
dialog::backdrop { background: rgba(56, 48, 95, .35); }
dialog h2 { font: 800 24px/1.2 var(--display); margin: 0 0 12px; }
dialog p { margin: 0 0 12px; }

/* ── Widok 2: TELEFON (publiczny), jak w SURGITOME: html.mobile przy (max-width: 760px) albo dotyk w poziomie.
   Pasek z menu, scena na całą szerokość, dolny dok: ‹ kadr › + kropki, przesunięcie palcem; opis jako wysuwany arkusz. */
html:not(.mobile) .monly { display: none !important; }
html.mobile .donly { display: none !important; }
html.mobile body { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
html.mobile .top { padding: 8px 12px; gap: 8px; flex-wrap: nowrap; }
html.mobile .brand img { height: 28px; }
html.mobile main { display: block; padding: 8px 12px; }
html.mobile .stage-wrap { width: 100%; margin: 0 auto; }
html.mobile main { padding: 8px 4px; }
html.mobile .controls { width: 100%; }
html.mobile .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 75dvh; overflow: auto; background: var(--paper);
  border: 0; border-top: var(--line) solid var(--ink); padding: 16px 16px calc(92px + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%); visibility: hidden; }   /* zamknięty: ukryty od razu, niezależnie od animacji */
html.mobile .panel.open { transform: none; visibility: visible; transition: transform .25s ease; box-shadow: 0 -8px 24px rgba(56, 48, 95, .18); }
html.mobile footer { padding-bottom: 12px; }
.mdock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--paper); border-top: var(--line) solid var(--ink);
  display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px 52px; align-items: center; gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); }
.mnav { height: 44px; border: 1.5px solid var(--ink); border-radius: 2px; background: var(--paper); font: 600 24px var(--sans); cursor: pointer; }
.mnav:disabled { opacity: .35; }
.mmid { min-width: 0; text-align: center; }
.mmid b { display: block; font: 600 12px var(--mono); letter-spacing: .06em; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mmid span { display: block; font: 600 14px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mdots { display: flex; justify-content: center; gap: 5px; margin-top: 4px; }
.mdots i { width: 7px; height: 7px; border: 1.5px solid var(--ink); border-radius: 50%; }
.mdots i.on { background: var(--blood); border-color: var(--blood); } .mdots i.done { background: var(--ink); }
.mmenu { position: fixed; inset: 0; z-index: 40; background: rgba(56, 48, 95, .35); }
.mmenu > div { position: absolute; inset: 0 0 auto 0; max-height: 88dvh; overflow: auto; background: var(--paper); border-bottom: var(--line) solid var(--ink); padding: 14px 16px 20px; }
.mmenu h4 { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 16px 0 8px; }
.mrow { display: flex; flex-wrap: wrap; gap: 8px; }
.mhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
/* Telefon poziomo: układ poziomy ryciny (16:9), niski nagłówek i dok, rycina na całą dostępną wysokość */
@media (orientation: landscape) {
  html.mobile .top { padding: 4px 12px; }
  html.mobile .brand img { height: 22px; }
  html.mobile #mMenuBtn { padding: 4px 10px; }
  html.mobile main { padding: 4px 8px; }
  html.mobile body { padding-bottom: calc(52px + env(safe-area-inset-bottom, 0px)); }
  html.mobile .mdock { padding: 4px 10px calc(4px + env(safe-area-inset-bottom, 0px)); }
  html.mobile .mnav { height: 38px; }
  html.mobile .stage-wrap { width: min(100%, calc((100dvh - 96px) * 16 / 9)); }
  html.mobile .mdots { display: none; }
}

/* ── Widok 3: STUDIO (tylko lokalnie, studio/index.html): telefon 9:16 na komputerze, do nagrywania ekranu.
   Sama scena 1080×1920 na całą wysokość okna, czarne tło, bez interfejsu i kursora; skróty w 12-studio.js. */
html.studio body { background: #000; overflow: hidden; padding: 0; }
html.studio body > :not(main):not(.studiohud):not(dialog) { display: none !important; }
html.studio main { display: flex; justify-content: center; align-items: center; padding: 0; margin: 0; max-width: none; height: 100vh; }
html.studio .panel, html.studio .controls { display: none !important; }
html.studio .stage-wrap { width: min(100vw, 100vh * 9 / 16); }
html.studio canvas#stage { border: 0; aspect-ratio: 9 / 16; }
html.studio.hidecursor, html.studio.hidecursor * { cursor: none !important; }
.studiohud { position: fixed; left: 12px; top: 12px; z-index: 50; max-width: 300px; background: rgba(242, 240, 241, .94); color: var(--ink);
  border: 1.5px solid var(--ink); padding: 10px 12px; font: 400 12px/1.6 var(--mono); }
.studiohud b { font-weight: 600; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="HoEBM Academy home"><img src="%LOGO%" alt="House of EBM"><span>Academy</span></a>
  <input class="search donly" id="search" type="search" placeholder="Search figures" aria-label="Search figures" autocomplete="off">
  <button class="btn donly" id="favBtn" type="button" aria-pressed="false" title="Favourites">★ <span>Favourites</span></button>
  <button class="btn ghost donly" id="srcBtn" type="button">Sources</button>
  <button class="btn ghost donly" id="citeBtn" type="button">How to cite</button>
  <button class="btn ghost donly" id="infoBtn" type="button" aria-label="About HoEBM Academy">?</button>
  <button class="btn monly" id="mMenuBtn" type="button" aria-expanded="false" aria-controls="mMenu">☰ Menu</button>
</header>
<nav class="series donly" id="series" aria-label="Series"></nav>
<nav class="figlist donly" id="figlist" aria-label="Figures"></nav>
<main>
  <div class="stagecol">
    <div class="stage-wrap"><canvas id="stage" width="1080" height="1920" role="img" aria-label="Figure"></canvas></div>
    <div class="controls" id="controls"></div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>
<footer id="footer"></footer>

<nav class="mdock monly" id="mDock" aria-label="Figure steps">
  <button class="mnav" id="mPrev" type="button" aria-label="Previous">‹</button>
  <div class="mmid"><b id="mFig"></b><span id="mStep"></span><div class="mdots" id="mDots"></div></div>
  <button class="mnav" id="mNext" type="button" aria-label="Next">›</button>
  <button class="mnav" id="mInfo" type="button" aria-label="About this figure" aria-expanded="false" aria-controls="panel">i</button>
</nav>
<div class="mmenu" id="mMenu" hidden><div role="dialog" aria-label="Menu">
  <div class="mhead"><input class="search" id="mq" type="search" placeholder="Search figures" aria-label="Search figures" autocomplete="off"><button class="btn" id="mMenuClose" type="button">Close</button></div>
  <div id="mMenuBody"></div>
</div></div>

<dialog id="startDlg" aria-labelledby="startT"></dialog>
<dialog id="srcDlg" aria-labelledby="srcT"></dialog>
<dialog id="citeDlg" aria-labelledby="citeT"></dialog>

<script>
(() => {
'use strict';
/*REG*/
const VERSION = '%VERSION%';
const LOGO_SRC = '%LOGO%';
const STUDIO = %STUDIO%;   // true tylko w studio/index.html (lokalnie)
/*CORE*/
/*APP*/
})();
</script>
</body>
</html>
