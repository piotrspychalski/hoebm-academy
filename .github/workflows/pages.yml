# Składanie, testy i publikacja HoEBM Academy na GitHub Pages przy każdej zmianie w gałęzi main (jak w SURGITOME)
name: HoEBM Academy — build, testy, publikacja
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Testy szybkie (budowa, rejestr i claims, zakazane treści, kontrast tokenów, liczby bez źródła i strefa bezpieczna)
        run: bash tests/uruchom_wszystkie.sh
        env:
          STUDIO_PATH: ${{ secrets.STUDIO_PATH }}   # studio online pod adresem znanym tylko autorowi (puste = bez studia)
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
