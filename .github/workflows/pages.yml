# Sports Academy: budowa, testy i publikacja na GitHub Pages przy każdej zmianie w main; na pull requestach tylko testy.
name: Sports Academy — build, testy, publikacja
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
# Wdrożenia w kolejce, bez przerywania: przerwane deploy-pages zostawia wiszące wdrożenie i blokuje następne
# (dwie sesje wypychające zmiany szybko po sobie). Pull requesty — osobna grupa, można przerywać.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Testy (budowa, Akademia publiczna, slajdy)
        run: bash tests/uruchom_wszystkie.sh
      - name: Budowa (Akademia + studio online zaszyfrowane hasłem)
        if: github.event_name != 'pull_request'
        run: node build.js
        env:
          STUDIO_PASSWORD: ${{ secrets.STUDIO_PASSWORD }}   # puste = bez studia online
      - name: Test studia online (tylko zaszyfrowane)
        if: github.event_name != 'pull_request'
        run: |
          node -e "
          const fs = require('fs');
          for (const f of ['dist/studio/index.html', 'dist/studio/sketch/index.html']) {
            if (!fs.existsSync(f)) continue;
            const h = fs.readFileSync(f, 'utf8');
            if (/initStudio|ROLKA/.test(h) || !h.includes('crypto.subtle.decrypt')) { console.error(f + ' nie jest zaszyfrowane'); process.exit(1); }
          }"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with: { path: dist }
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
